<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etiqueta iframe</title>
  </head>
  <body>
    <h1>Tercer DLC The Witcher 3</h1>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/SB3siHVCHpY?si=aJpLveMR1nH7Y_sz"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
