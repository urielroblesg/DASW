<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Anatomía de CSS</title>
    <style>
      * {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
      }

      h1 {
        color: rgb(44, 50, 37);
        font-size: 32px;
        text-align: center;
      }

      p {
        color: #34495e;
        line-height: 1.6;
      }

      .parrafo-importante {
        background-color: #fff9e6;
        border-left: 4px solid #f39c12;
        padding: 10px;
        border-radius: 4px;
      }

      #boton-principal {
        background-color: #667eea;
        border: none;
        color: white;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      a {
        color: #3498db;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Mi Página de Prueba</h1>
    <p class="parrafo-importante">Este es un párrafo importante</p>
    <p>Este es un párrafo normal</p>
    <button id="boton-principal">Click aquí</button>
    <a href="#">Un enlace</a>
  </body>
</html>
