<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pseudoelementos</title>
    <style>
      /*
        * #f39c12
        * #e74c3c
        * #667eea
        * #2c3e50
        * #f1c40f
        * 
        */

      /* Estiliza utilizando pseudoelementos: 
      1. Añade un ícono/texto antes de los párrafos .nota 
      2. Agrega la flecha ' ↗' después de los enlaces .externo 
      3. Crea una letra capitulina en la primera letra del artículo 
      4. Destaca la primera línea del artículo en mayúsculas 
      5. Cambia el color de selección de texto a amarillo/negro 
      */

      .nota::before {
        content: "💪 Nota:";
        font-weight: bold;
        color: #f39c12;
      }

      .externo::after {
        content: "→";
        font-size: 1.8em;
        color: red;
      }

      .intro::first-letter {
        letter-spacing: 1.5px;
        color: #667eea;
        line-height: 1;
        font-size: 2.5em;
        margin-right: 8px;
        float: left;
      }

      .intro::first-line {
        font-weight: bold;
        letter-spacing: 1px;
        color: rgb(31, 32, 31);
      }

      ::selection {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <h1>Demostración de Pseudoelementos</h1>
    <article>
      <p class="intro">
        El desarrollo web moderno requiere dominar CSS a fondo para lograr
        interfaces atractivas, eficientes y mantenibles sin recargar el marcado
        HTML innecesariamente.
      </p>
      <p class="nota">Este es un mensaje de nota importante.</p>
      <p>
        Para más información, visita nuestro
        <a href="https://example.com" class="externo">sitio web externo</a>.
      </p>
    </article>
  </body>
</html>
